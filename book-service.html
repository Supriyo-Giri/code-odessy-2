<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Service | Swiggy Instamart</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <style>
    /* General Reset & Theme */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #e0f7fa, #f3f8ff);
      color: #333;
      line-height: 1.7;
      padding: 15px;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 25px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0e0e0;
      margin-bottom: 20px;
      color: #0277bd;
    }

    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0288d1;
    }

    .logo span {
      color: #fc8019;
    }

    .close-btn {
      background: #e57373;
      color: white;
      border: none;
      padding: 8px 15px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .close-btn:hover {
      background: #d32f2f;
      transform: translateY(-2px);
    }

    h1 {
      font-size: 1.8rem;
      color: #0277bd;
      margin-bottom: 25px;
      text-align: center;
    }

    /* Service Summary */
    .service-summary {
      display: flex;
      align-items: center;
      background: #f8fdff;
      border: 1px solid #bbdefb;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 30px;
    }

    .service-icon {
      margin-right: 20px;
    }

    .service-icon img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 10px;
    }

    .service-details h2 {
      color: #0277bd;
      margin-bottom: 8px;
      font-size: 1.4rem;
    }

    .service-details p {
      color: #555;
      font-size: 1rem;
    }

    /* Form */
    .form-group {
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 600;
      color: #0277bd;
      font-size: 1.1rem;
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      border: 1px solid #bbdefb;
      border-radius: 8px;
      font-size: 1rem;
      background: #f8fdff;
    }

    /* Plumbing Issues Grid - Increased height */
    .plumbing-issues {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .plumbing-issues div {
      border: 2px solid #bbdefb;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      height: 180px; /* Increased height */
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .plumbing-issues div:hover {
      border-color: #0288d1;
      background-color: #e3f2fd;
      transform: translateY(-5px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
    }

    .plumbing-issues div.selected {
      border-color: #0288d1;
      background-color: #e3f2fd;
      transform: scale(1.03);
      box-shadow: 0 5px 15px rgba(2, 136, 209, 0.2);
    }

    .plumbing-issues div img {
      width: 100%;
      height: 100px; /* Increased image height */
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .plumbing-issues div p {
      font-size: 1rem;
      font-weight: 600;
      margin: 0;
      color: #0277bd;
    }

    /* Input Group */
    .input-group {
      display: flex;
      align-items: center;
      margin-bottom: 20px;
    }

    .input-group input {
      width: 80%;
      margin-right: 10px;
      padding: 14px;
    }

    .camera-icon {
      cursor: pointer;
      width: 50px;
      height: 50px;
      padding: 10px;
      border: 1px solid #bbdefb;
      border-radius: 8px;
      background: #f8fdff;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .camera-icon:hover {
      background: #e3f2fd;
      transform: scale(1.05);
    }

    /* Hidden file input */
    #imageUpload {
      display: none;
    }

    /* Preview of selected image */
    .image-preview {
      margin-top: 15px;
      text-align: center;
    }

    .image-preview img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 8px;
      border: 1px solid #ddd;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1);
    }

    /* Action Buttons */
    .actions {
      display: flex;
      gap: 20px;
      margin-top: 30px;
    }

    .btn {
      flex: 1;
      padding: 16px;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .btn-primary {
      background: #0288d1;
      color: white;
    }

    .btn-primary:hover {
      background: #01579b;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(2, 136, 209, 0.3);
    }

    .btn-outline {
      background: #f8fdff;
      color: #0288d1;
      border: 2px solid #0288d1;
    }

    .btn-outline:hover {
      background: #0288d1;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(2, 136, 209, 0.3);
    }

    /* Responsive */
    @media (max-width: 900px) {
      .plumbing-issues {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 15px;
      }
      
      .plumbing-issues {
        grid-template-columns: 1fr;
      }
      
      .plumbing-issues div {
        height: 160px;
      }
      
      .plumbing-issues div img {
        height: 90px;
      }
      
      .service-summary {
        flex-direction: column;
        text-align: center;
      }

      .service-icon {
        margin-right: 0;
        margin-bottom: 15px;
      }

      .actions {
        flex-direction: column;
      }
      
      h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Header -->
    <header>
      <div class="logo">Swiggy <span>Instamart</span></div>
      <a href="./customer.html"><button class="close-btn" >Close</button></a>
    </header>

    <h1>Book Service Instantly</h1>

    <!-- Service Summary with Real Icon -->
    <div class="service-summary">
      <div class="service-icon">
        <img
          src="https://plus.unsplash.com/premium_photo-1677683508374-a6f50382eb66?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
          alt="Plumber">
      </div>
      <div class="service-details">
        <h2>Plumbing Service</h2>
        <p>Fix leaks, taps, drainage & more — at your doorstep in 30–60 mins</p>
      </div>
    </div>

    <!-- Address Selection -->
    <div class="form-group">
      <label for="address">Select Address</label>
      <select id="address">
        <option value="home">Home, 123 Main St, Mumbai</option>
        <option value="office">Office, Bandra Tech Park, Mumbai</option>
        <option value="other">+ Add New Address</option>
      </select>
    </div>
    
    <!-- Plumbing Issues Selection -->
    <div class="form-group">
      <label>Select Plumbing Issue</label>
      <div class="plumbing-issues">
        <div>
          <img src="https://images.unsplash.com/photo-1637939157381-fe0d03755314?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTR8fExlYWt5JTIwRmF1Y2V0JTJGVGFwfGVufDB8fDB8fHww" alt="Leaky Faucet">
          <p>Leaky Faucet/Tap</p>
        </div>
        <div>
          <img src="https://images.unsplash.com/photo-1700174542278-4f8fc5ab6565?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Clogged Sink">
          <p>Clogged sink/drain</p>
        </div>
        <div>
          <img src="https://images.unsplash.com/photo-1720889589894-497c4f4f569e?q=80&w=1976&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Leaky Pipe">
          <p>Leaky pipe</p>
        </div>
        <div>
          <img src="https://images.unsplash.com/photo-1669920282675-5e3cc6f73b17?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Low Water Pressure">
          <p>Low water pressure</p>
        </div>
        <div>
          <img src="https://plus.unsplash.com/premium_photo-1661301068444-8ac48208d017?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Leaking Water Heater">
          <p>Leaking water heater/geyser</p>
        </div>
        <div>
          <img src="https://plus.unsplash.com/premium_photo-1664392164625-4f806c5f70f5?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8VG9pbGV0JTIwZmx1c2glMjBwcm9ibGVtfGVufDB8fDB8fHww" alt="Toilet Flush Problem">
          <p>Toilet flush problem</p>
        </div>
      </div>
    </div>

    <!-- Additional Input and Camera -->
    <div class="form-group">
      <label>Additional Information</label>
      <div class="input-group">
        <input type="text" id="additionalInfo" placeholder="Describe your issue or something else...">
        <label for="imageUpload" class="camera-icon">
          <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0IiBmaWxsPSJub25lIiBzdHJva2U9IiMwMjg4ZDEiIHN0cm9rZS13aWR0aD0iMiIgc3Ryb2tlLWxpbmVjYXA9InJvdW5kIiBzdHJva2UtbGluZWpvaW49InJvdW5kIj48cGF0aCBkPSJNMTIgMTNhMyAzIDAgMSAwIDAgNiAzIDMgMCAwIDAgMC02eiIvPjxwYXRoIGQ9Ik0yMCA5VjdhMiAyIDAgMCAwLTItMkg2YTIgMiAwIDAgMC0yIDJ2Mm0yIDJoMTZhMiAyIDAgMCAxIDIgMnY4YTIgMiAwIDAgMS0yIDJINGEyIDIgMCAwIDEtMi0ydi04YTIgMiAwIDAgMSAyLTJ6Ii8+PC9zdmc+" alt="Upload Image" width="28" height="28">
        </label>
        <input type="file" id="imageUpload" accept="image/*">
      </div>
      <div class="image-preview" id="imagePreview"></div>
    </div>

    <!-- Action Buttons -->
    <div class="actions">
      <button class="btn btn-outline" id="saveLaterBtn">Save for Later</button>
      <a href="./billing-options.html"><button class="btn btn-primary" id="confirmBookBtn">Confirm & Book</button></a>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // Select plumbing issue cards
      const issueCards = document.querySelectorAll('.plumbing-issues div');
      let selectedIssue = null;
      
      issueCards.forEach(card => {
        card.addEventListener('click', function() {
          // Remove selected class from all cards
          issueCards.forEach(c => c.classList.remove('selected'));
          
          // Add selected class to clicked card
          this.classList.add('selected');
          selectedIssue = this.querySelector('p').textContent;
        });
      });
      
      // Camera icon functionality
      const imageUpload = document.getElementById('imageUpload');
      const imagePreview = document.getElementById('imagePreview');
      
      imageUpload.addEventListener('change', function() {
        const file = this.files[0];
        if (file) {
          const reader = new FileReader();
          
          reader.addEventListener('load', function() {
            imagePreview.innerHTML = `<img src="${reader.result}" alt="Preview">`;
          });
          
          reader.readAsDataURL(file);
        }
      });
      
      // Confirm & Book button functionality
      const confirmBookBtn = document.getElementById('confirmBookBtn');
      
      confirmBookBtn.addEventListener('click', function() {
        const address = document.getElementById('address').value;
        
        if (!selectedIssue) {
          alert('Please select a plumbing issue');
          return;
        }
        
        // Store selection in sessionStorage to pass to next page
        sessionStorage.setItem('selectedIssue', selectedIssue);
        sessionStorage.setItem('selectedAddress', document.getElementById('address').options[document.getElementById('address').selectedIndex].text);
        sessionStorage.setItem('additionalInfo', document.getElementById('additionalInfo').value);
        
        // Redirect to tracking page
        window.location.href = './tracking.html';
      });
      
      // Save for Later button functionality
      const saveLaterBtn = document.getElementById('saveLaterBtn');
      
      saveLaterBtn.addEventListener('click', function() {
        alert('Service details saved for later!');
      });
    });
  </script>
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
    crossorigin="anonymous"></script>
</body>
  
</html>
